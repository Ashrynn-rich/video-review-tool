<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>影片審核工具</title>
<style>
:root{
  --bg:#14161b; --panel:#1d2027; --panel2:#262a33; --line:#363b47;
  --text:#e9ebf0; --muted:#98a0b0; --accent:#4c8dff; --danger:#ff5d5d;
  --panel-w:380px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:#566}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 6px}
textarea,input[type=text]{background:#12141a;border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
textarea{resize:vertical;min-height:64px}

#top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#top h1{font-size:16px;margin:0;white-space:nowrap}
#top h1 small{color:var(--muted);font-weight:400;font-size:12px;margin-left:4px}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}

#main{flex:1;min-height:0;display:flex}
#stage{flex:1;min-width:0;display:flex;flex-direction:column}
#viewer{flex:1;min-height:0;position:relative;background:#000}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#cv{position:absolute;display:none;pointer-events:none;touch-action:none;cursor:crosshair}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);text-align:center;padding:20px;cursor:pointer}
#empty b{font-size:18px;color:var(--text)}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.65);color:#fff;z-index:5;text-align:center;padding:20px}
.spin{width:36px;height:36px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#loadingText{white-space:pre-line;word-break:break-all}
.cvthumb{display:block;width:100%;max-width:320px;border-radius:8px;background:#000;margin:8px 0}
.cvwarn{background:#4a3a12;border:1px solid #8a6d1c;border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}

#tl{padding:8px 12px 2px;background:var(--panel)}
#tlbar{position:relative;height:18px;background:#0e1014;border:1px solid var(--line);border-radius:6px;cursor:pointer;touch-action:none}
#tlfill{position:absolute;left:0;top:0;bottom:0;width:0;background:#2b4a80;border-radius:5px 0 0 5px}
#tlhead{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1px;background:#fff;border-radius:2px;pointer-events:none}
.mark{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;border-radius:2px}
.mark.pending{background:#ff5d5d}.mark.fixed{background:#ffcc33}.mark.confirmed{background:#3ddc84}.mark.wontfix{background:#aab}
.mark.act{outline:2px solid #fff}

#ctrl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 12px 8px;background:var(--panel)}
#ctrl .sp{flex:1}
#ctrl button.step{min-width:42px;font-size:15px}
#readout{font-variant-numeric:tabular-nums;display:flex;gap:12px;align-items:baseline;white-space:nowrap}
#tcText{font-size:18px;font-weight:600;letter-spacing:.5px}
#frText{color:var(--muted)}
#panel.drawing #fbar,#panel.drawing #list,#panel.drawing #warn,#panel.drawing #bDraw2{display:none}
#drawbar{padding:12px;border-bottom:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;gap:12px}
#drawbar h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
#drawbar h3 .sp{flex:1}
.dsec{font-size:12px;color:var(--muted);margin-bottom:5px}
.hint{font-size:12px;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:6px}
.tools button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:12px}
.tools button .ic{font-size:22px;line-height:1}
.swgrid{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:38px;height:38px;border-radius:50%;padding:0;border:3px solid var(--line)}
.sw.on{border-color:#fff;box-shadow:0 0 0 3px var(--accent)}
.colorpick{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.colorpick input[type=color]{width:38px;height:38px;padding:0;border:1px solid var(--line);border-radius:50%;background:none;cursor:pointer}
.widths{display:flex;gap:6px}
.widths button{flex:1;height:40px;display:flex;align-items:center;justify-content:center}
.widths i{display:block;width:60%;background:currentColor;border-radius:4px}
#bDraw2{border-color:var(--accent);color:#9cc2ff}
#cexist{display:flex;flex-direction:column;gap:6px;background:#12141a;border:1px solid var(--line);border-radius:8px;padding:10px}
#cexist .exsum{color:var(--muted);font-size:13px;white-space:pre-wrap;word-break:break-word}

#split{width:6px;cursor:col-resize;background:var(--line);touch-action:none}
#split:hover{background:var(--accent)}
#panel{width:var(--panel-w);min-width:240px;max-width:70vw;background:var(--panel);display:flex;flex-direction:column;min-height:0}
#composer{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
#cinfo{color:var(--muted);font-size:13px}
#cinfo b{color:var(--text)}
.crow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crow .sp{flex:1}
.dthumbs{display:flex;gap:6px;flex-wrap:wrap}
.dthumbs .t{position:relative}
.dthumbs img{height:48px;border-radius:6px;display:block}
.dthumbs .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;padding:0;line-height:1;font-size:12px}
#warn{margin:8px 12px 0;padding:8px 10px;border-radius:8px;background:#4a3a12;border:1px solid #8a6d1c;font-size:13px}
#fbar{display:flex;gap:8px;align-items:center;padding:8px 12px}
#fbar b{flex:1}
#list{flex:1;min-height:0;overflow:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.none{color:var(--muted);text-align:center;padding:24px 0}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.card.at{border-color:var(--accent)}
.card.active{box-shadow:0 0 0 2px var(--accent)}
.chead{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.chead .n{color:var(--text);font-weight:700}
.chead .who{color:var(--text)}
.ctext{white-space:pre-wrap;word-break:break-word;margin:4px 0}
.cthumbs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.cthumbs img{height:56px;border-radius:6px;cursor:zoom-in}
.cact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.cact button{padding:2px 8px;font-size:12px}
.cact select{font-size:12px;padding:2px 4px}
.cact .sp{flex:1}
.stby{font-size:11px;color:var(--muted)}
.replies{margin-top:6px;border-top:1px dashed var(--line);padding-top:4px;display:flex;flex-direction:column;gap:4px}
.reply{font-size:13px;display:flex;gap:6px}
.reply .rb{flex:1;white-space:pre-wrap;word-break:break-word}
.reply .rw{color:var(--muted);font-size:12px}
.reply button{padding:0 6px;font-size:12px;border:none;background:none;color:var(--muted)}
.rbox{display:flex;gap:6px;margin-top:6px}
.rbox textarea{min-height:40px}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modalBody{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:92vw;max-height:92vh;overflow:auto;min-width:260px}
#modalBody img{max-width:88vw;max-height:80vh;display:block}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:10px;z-index:60;max-width:90vw;text-align:center}

@media (pointer:coarse){
  /* iPhone Safari：輸入框字小於 16px 時，點進去會自動放大整個頁面 */
  input,textarea,select{font-size:16px!important}
}
@media (max-width:820px) and (orientation:portrait){
  #main{flex-direction:column;overflow:auto}
  #stage{flex:none}
  #viewer{flex:none;height:36dvh}
  #split{display:none}
  #panel{width:100%;max-width:none;flex:none;min-height:50dvh}
  #list{overflow:visible;flex:none}
  #top h1{font-size:14px}
  .hbtns button{padding:5px 7px;font-size:13px}
}
@media (max-width:820px) and (orientation:landscape){
  :root{--panel-w:300px}
}
</style>
</head>
<body>

<header id="top">
  <h1>🎬 影片審核 <small id="ver"></small></h1>
  <div class="hbtns">
    <button id="btnVideo">📂 選影片</button>
    <button id="btnLoad">📥 載入評論檔</button>
    <button id="btnSave" class="primary">💾 儲存評論檔</button>
    <button id="btnShare">📤 分享</button>
    <button id="btnPdf">📄 匯出 PDF</button>
    <button id="btnName">👤 —</button>
  </div>
</header>

<main id="main">
  <section id="stage">
    <div id="viewer">
      <video id="video" playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
      <canvas id="cv"></canvas>
      <div id="empty"><b>點這裡選擇影片（MP4／MOV）</b><span>或把影片、評論檔（.json）直接拖進視窗</span></div>
      <div id="loading" hidden><div class="spin"></div><div id="loadingText"></div></div>
    </div>
    <div id="tl"><div id="tlbar"><div id="tlfill"></div><div id="tlhead"></div></div></div>
    <div id="ctrl">
      <button class="step" id="bM10" title="後退 10 幀">⏮ 10</button>
      <button class="step" id="bM1" title="後退 1 幀（←）">◀ 1</button>
      <button class="step" id="bPlay" title="播放／暫停（空白鍵）">▶</button>
      <button class="step" id="bP1" title="前進 1 幀（→）">1 ▶</button>
      <button class="step" id="bP10" title="前進 10 幀">10 ⏭</button>
      <div id="readout"><span id="tcText">00:00:00:00</span><span id="frText">第 0 / 0 幀</span></div>
      <span class="sp"></span>
      <select id="fpsSel" title="影片幀率"></select>
      <select id="rateSel" title="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
      <button id="bDraw">✏️ 畫圖</button>
      <button id="bComment" class="primary">💬 評論此幀</button>
    </div>
  </section>

  <div id="split" title="拖曳調整評論欄寬度"></div>

  <aside id="panel">
    <div id="drawbar" hidden>
      <h3>✏️ 畫圖標註</h3>
      <div class="hint">在左邊影片上「按住拖曳」就能畫圖，畫完直接在下方寫評論並按「新增評論」。圖只屬於畫它的那一幀，<b>跳到別幀，沒送出的圖會被放棄</b>。要離開畫圖：按影片下方的「✔ 離開畫圖」，或鍵盤 Esc。</div>
      <div><div class="dsec">① 選擇圖形</div><div class="tools">
        <button data-tool="pen" class="on"><span class="ic">✏️</span>畫筆</button>
        <button data-tool="arrow"><span class="ic">➡️</span>箭頭</button>
        <button data-tool="ellipse"><span class="ic">⭕</span>圓圈</button>
        <button data-tool="rect"><span class="ic">▭</span>方框</button>
        <button data-tool="eraser"><span class="ic">🧽</span>橡皮擦</button>
      </div></div>
      <div><div class="dsec">② 選擇顏色（背景不好認就換色）</div><div class="swgrid"><span id="swatches" style="display:contents"></span><label class="colorpick"><input type="color" id="colorIn" value="#ff3b30" title="自選顏色"><span>自選</span></label></div></div>
      <div><div class="dsec">③ 線條粗細</div><div class="widths">
        <button data-w="0.003" title="細"><i style="height:2px"></i></button>
        <button data-w="0.006" class="on" title="中"><i style="height:4px"></i></button>
        <button data-w="0.012" title="粗"><i style="height:8px"></i></button>
      </div></div>
      <div class="crow"><button id="bUndo">↩ 復原</button><button id="bClear">🗑 清除本次畫的圖</button></div>
      <div class="hint">🧽 橡皮擦只能擦「這次新畫的」圖；已送出的評論要按該則的「編輯」，才能修改它的圖。</div>
    </div>
    <div id="composer">
      <div id="cinfo"></div>
      <div id="cexist" hidden></div>
      <textarea id="ctext" placeholder="在這一幀輸入評論…（⌘/Ctrl + Enter 送出）"></textarea>
      <div class="dthumbs" id="dthumbs"></div>
      <div class="crow" id="crowMain">
        <button id="bDraw2">✏️ 畫圖標註</button>
        <button id="bAttach">📎 附圖</button>
        <span id="dsum" class="stby"></span>
        <span class="sp"></span>
        <button id="bCancel" hidden>取消編輯</button>
        <button id="bSubmit" class="primary">新增評論</button>
      </div>
    </div>
    <div id="warn" hidden></div>
    <div id="fbar">
      <b id="ccount">評論</b>
      <select id="filterSel"></select>
    </div>
    <div id="list"></div>
  </aside>
</main>

<input type="file" id="fVideo" accept="video/*,.mp4,.m4v,.mov" hidden>
<input type="file" id="fReview" accept=".json,application/json" multiple hidden>
<input type="file" id="fImg" accept="image/*" multiple hidden>
<div id="modal" hidden><div id="modalBody"></div></div>
<div id="toast" hidden></div>

<script>
(() => {
'use strict';

const VERSION = '1.0.0';
const FPS_OPTIONS = [30, 60, 90, 120];
const STATUS = {
  pending:   { label: '待處理', icon: '🔴' },
  fixed:     { label: '已修改', icon: '🟡' },
  confirmed: { label: '已確認', icon: '🟢' },
  wontfix:   { label: '不處理', icon: '⚪' },
};
const SWATCHES = ['#ff3b30', '#ffd60a', '#30d158', '#0a84ff', '#ffffff', '#000000'];

const $ = s => document.querySelector(s);
const video = $('#video'), cv = $('#cv'), viewer = $('#viewer');

const state = {
  fps: 30,
  videoMeta: null,        // {name,size,duration}
  reviewMeta: null,       // 評論檔記錄的影片資訊
  comments: [],
  active: null,
  author: '',
  dirty: false,
  filter: 'all',
  drawing: false,
  tool: 'pen',
  color: SWATCHES[0],
  width: 0.006,
  draft: { editingId: null, time: null, strokes: [], attachments: [] },
  replyOpen: null,
  videoUrl: null,
  busy: false,
};
let needRender = true;

/* ---------- 小工具 ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = (n, l = 2) => String(n).padStart(l, '0');
const baseName = n => (n || '影片').replace(/\.[^.]+$/, '');
const fmtTime = ts => new Date(ts).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

let toastTimer;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms);
}
function modal(html) { $('#modalBody').innerHTML = html; $('#modal').hidden = false; }
function closeModal() { $('#modal').hidden = true; $('#modalBody').innerHTML = ''; }
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal' && !state.busy) closeModal(); });

function markDirty() { state.dirty = true; }
window.addEventListener('beforeunload', e => { if (state.dirty) { e.preventDefault(); e.returnValue = ''; } });

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}

/* ---------- 幀 / 時間碼 ---------- */
const curFrame = () => Math.max(0, Math.floor(video.currentTime * state.fps + 1e-4));
const totalFrames = () => Math.floor((video.duration || 0) * state.fps + 1e-4);
const frameOf = t => Math.max(0, Math.floor(t * state.fps + 1e-4));
const cFrame = c => frameOf(c.time);
function tc(frame) {
  const fps = state.fps, s = Math.floor(frame / fps), ff = frame % fps;
  return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60) + ':' + pad(ff, String(fps - 1).length);
}
function seekFrame(f) {
  if (!video.duration) return;
  video.pause();
  f = Math.max(0, Math.min(Math.max(0, totalFrames() - 1), f));
  video.currentTime = (f + 0.5) / state.fps;   // 落在該幀正中間，避免差一幀
}
const stepFrames = n => { if (!video.duration) return; video.pause(); seekFrame(curFrame() + n); };

/* ---------- 評論資料 ---------- */
const live = () => state.comments.filter(c => !c.deleted);
const sortedLive = () => live().sort((a, b) => a.time - b.time || a.createdAt - b.createdAt);
const byId = id => state.comments.find(c => c.id === id);
const commentAt = f => live().find(c => cFrame(c) === f);   // 一幀只能有一則評論

const IMG_RE = /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/;
const COLOR_RE = /^#[0-9a-fA-F]{6}$/;
const num = (v, d = 0) => (typeof v === 'number' && isFinite(v) ? v : d);
function sanitizeStroke(s) {
  if (!s || !['pen', 'arrow', 'ellipse', 'rect'].includes(s.t) || !Array.isArray(s.p)) return null;
  const p = s.p.filter(q => Array.isArray(q) && q.length === 2).map(q => [num(q[0]), num(q[1])]);
  if (!p.length) return null;
  return { t: s.t, color: COLOR_RE.test(s.color) ? s.color : '#ff3b30', w: Math.min(0.05, Math.max(0.001, num(s.w, 0.006))), p };
}
function sanitizeComment(c) {
  if (!c || typeof c.id !== 'string') return null;
  const now = Date.now();
  return {
    id: c.id.slice(0, 40),
    time: Math.max(0, num(c.time)),
    author: String(c.author || '').slice(0, 40),
    text: String(c.text || '').slice(0, 5000),
    status: STATUS[c.status] ? c.status : 'pending',
    statusBy: c.statusBy ? String(c.statusBy).slice(0, 40) : '',
    statusAt: num(c.statusAt, 0),
    createdAt: num(c.createdAt, now),
    updatedAt: num(c.updatedAt, now),
    deleted: !!c.deleted,
    strokes: (Array.isArray(c.strokes) ? c.strokes : []).map(sanitizeStroke).filter(Boolean),
    attachments: (Array.isArray(c.attachments) ? c.attachments : []).filter(u => typeof u === 'string' && IMG_RE.test(u)),
    replies: (Array.isArray(c.replies) ? c.replies : []).filter(r => r && typeof r.id === 'string').map(r => ({
      id: r.id.slice(0, 40), author: String(r.author || '').slice(0, 40), text: String(r.text || '').slice(0, 3000),
      createdAt: num(r.createdAt, now), updatedAt: num(r.updatedAt, now), deleted: !!r.deleted,
    })),
  };
}
function mergeComments(incoming) {
  let added = 0, updated = 0;
  for (const raw of incoming) {
    const n = sanitizeComment(raw); if (!n) continue;
    const old = byId(n.id);
    if (!old) { state.comments.push(n); added++; continue; }
    const rmap = new Map(old.replies.map(r => [r.id, r]));
    for (const r of n.replies) { const o = rmap.get(r.id); if (!o || r.updatedAt > o.updatedAt) rmap.set(r.id, r); }
    const replies = [...rmap.values()].sort((a, b) => a.createdAt - b.createdAt);
    if (n.updatedAt > old.updatedAt) { Object.assign(old, n, { replies }); updated++; }
    else old.replies = replies;
  }
  return { added, updated };
}

      if (shown || settled) return; shown = true;
      modal(head + (thumb ? '<img class="cvthumb" src="' + thumb + '">' : '') + (info ? '<div class="stby">' + info + '</div>' : '') +
        (err ? '<div class="cvwarn">' + err + '</div>' : '') +
        (replacing && !err ? '<div class="cvwarn">目前的影片「' + esc(state.videoMeta.name) + '」會被換掉（已寫的評論不會刪除）。</div>' : '') +
        '<div class="crow" style="margin-top:12px"><span class="sp"></span><button id="cvNo">' + (err ? '關閉' : '取消') + '</button>' +
        (err ? '' : '<button id="cvOk" class="primary">載入這支影片</button>') + '</div></div>');
      $('#cvNo').onclick = () => finish(false);
      const ok = $('#cvOk'); if (ok) ok.onclick = () => finish(true);
    };
    const draw = () => {
      let thumb = '';
      try {
        const w = 320, h = Math.max(1, Math.round(w * probe.videoHeight / probe.videoWidth)), c = document.createElement('canvas');
        c.width = w; c.height = h; c.getContext('2d').drawImage(probe, 0, 0, w, h); thumb = c.toDataURL('image/jpeg', 0.7);
      } catch {}
      show(thumb, '長度 ' + fmtDur(probe.duration) + '　·　' + probe.videoWidth + '×' + probe.videoHeight);
    };
    probe.addEventListener('loadedmetadata', () => {
      probe.addEventListener('seeked', () => setTimeout(draw, 60), { once: true });
      try { probe.currentTime = Math.min(0.1, (probe.duration || 0) / 2); } catch { draw(); }
    });
    probe.addEventListener('error', () => show('', '', '這支影片目前的瀏覽器無法播放。iPhone 拍的 MOV（HEVC 編碼）在 Windows 的 Chrome／Edge 可能不支援，請改用 Safari 或先轉成 MP4（H.264）。'));
    const timer = setTimeout(() => show('', '（讀不到預覽，但可以嘗試載入）'), 8000);
    probe.src = url;
  });
}

function loadVideo(file) {

});

function detectFps() {
  return new Promise(resolve => {
    if (!('requestVideoFrameCallback' in video)) return resolve(null);
    const times = [], wasMuted = video.muted; let done = false;
    const finish = () => {
      if (done) return; done = true;
      video.pause(); video.muted = wasMuted;
      const d = []; for (let i = 1; i < times.length; i++) { const x = times[i] - times[i - 1]; if (x > 1e-4) d.push(x); }
      if (d.length < 5) return resolve(null);
      d.sort((a, b) => a - b); const fps = 1 / d[Math.floor(d.length / 2)];
      const hit = FPS_OPTIONS.find(o => Math.abs(fps / o - 1) < 0.05);
      resolve(hit || null);
    };
    const cb = (now, meta) => { times.push(meta.mediaTime); if (times.length < 30 && !done) video.requestVideoFrameCallback(cb); else finish(); };
    video.muted = true; video.currentTime = 0; video.playbackRate = 1;
    video.requestVideoFrameCallback(cb);
    const p = video.play(); if (p && p.catch) p.catch(finish);
    setTimeout(finish, 2500);
  });
}

function checkMatch() {
  const w = $('#warn'), m = state.reviewMeta, v = state.videoMeta;
  if (!m || !v || !v.duration) { w.hidden = true; return; }
  const bad = [];
  if (m.name && m.name !== v.name) bad.push('檔名不同（評論檔：' + m.name + '）');
  if (m.duration && Math.abs(m.duration - v.duration) > 0.1) bad.push('長度不同（評論檔：' + m.duration.toFixed(2) + ' 秒，目前：' + v.duration.toFixed(2) + ' 秒）');
  if (m.size && m.size !== v.size) bad.push('檔案大小不同');
  if (!bad.length) { w.hidden = true; return; }
  w.hidden = false;
  w.innerHTML = '⚠️ 這份評論檔對應的影片和目前影片<b>不一致</b>：' + bad.map(esc).join('；') + '。評論的位置可能對不上，請確認是不是同一版影片。';
}

async function loadReviewFile(file) {

async function handleFiles(files) {

/* ---------- 匯出 PDF（A4 橫向，一頁一則評論） ---------- */
const wait = ms => new Promise(r => setTimeout(r, ms));
function seekTime(t) {
  return new Promise(res => {
    if (Math.abs(video.currentTime - t) < 1e-4) return res();
    const h = () => { video.removeEventListener('seeked', h); res(); };
    video.addEventListener('seeked', h); video.currentTime = t; setTimeout(res, 3000);
  });
}
function wrapLines(ctx, text, maxW) {
  const out = [];
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const ch of para) { if (ctx.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; } else line += ch; }
    out.push(line);
  }
  return out;
}
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const canvasJpeg = cn => new Promise(r => cn.toBlob(r, 'image/jpeg', 0.9));

/* 把每頁的 JPEG 組成 PDF（不用外部函式庫） */
function makePdf(pages) {
  const enc = new TextEncoder(), chunks = [], offsets = []; let pos = 0;
  const push = b => { if (typeof b === 'string') b = enc.encode(b); chunks.push(b); pos += b.length; };
  const obj = (n, fn) => { offsets[n] = pos; push(n + ' 0 obj\n'); fn(); push('\nendobj\n'); };
  const n = pages.length, total = 3 * n + 3;
  push('%PDF-1.4\n');
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push('<< /Type /Pages /Count ' + n + ' /Kids [' + pages.map((_, i) => (3 + 3 * i) + ' 0 R').join(' ') + '] >>'));
  pages.forEach((p, i) => {
    const pg = 3 + 3 * i, ct = 4 + 3 * i, im = 5 + 3 * i, content = 'q 842 0 0 595 0 0 cm /Im0 Do Q';
    obj(pg, () => push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 842 595] /Resources << /XObject << /Im0 ' + im + ' 0 R >> >> /Contents ' + ct + ' 0 R >>'));
    obj(ct, () => push('<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream'));
    obj(im, () => {
      push('<< /Type /XObject /Subtype /Image /Width ' + p.w + ' /Height ' + p.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + p.data.length + ' >>\nstream\n');
      push(p.data); push('\nendstream');
    });
  });
  const xref = pos; let x = 'xref\n0 ' + total + '\n0000000000 65535 f \n';
  for (let k = 1; k < total; k++) x += String(offsets[k]).padStart(10, '0') + ' 00000 n \n';
  push(x + 'trailer\n<< /Size ' + total + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF');
  return new Blob(chunks, { type: 'application/pdf' });
}

/* 該幀畫面（含畫的圖） */
function frameCanvas(c) {
  const vw = video.videoWidth, vh = video.videoHeight, sc = Math.min(1, 1920 / vw), W = Math.round(vw * sc), H = Math.round(vh * sc);
  const cn = document.createElement('canvas'); cn.width = W; cn.height = H;
  const ctx = cn.getContext('2d'); ctx.drawImage(video, 0, 0, W, H);
  c.strokes.forEach(s => drawStroke(ctx, s, W, H));
  return cn;
}

const PG = { W: 2000, H: 1414, M: 70, IMG_W: 1200, COL_X: 1320, COL_W: 610, TOP: 110, BOTTOM: 1324 };
const PG_FONT = '"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif';
const STATUS_COLOR = { pending: '#e5484d', fixed: '#f5a524', confirmed: '#2fb15c', wontfix: '#9aa0aa' };

/* 為一則評論排版成 1～多頁。依畫面比例自動切換版型：
   橫式：畫面在左上、文字在右、附件在畫面下方（整頁寬度）
   直式／近正方形：畫面撐滿整頁高度在左、文字與附件都在右邊
   原則：畫面優先；附件盡量同一頁（放不下先整體縮小，縮到一半仍放不下才接續頁） */
async function renderCommentPages(c, n, total, fcv, title) {
  const out = [], f = cFrame(c), st = STATUS[c.status];
  const atts = []; for (const u of c.attachments) { try { atts.push(await loadImg(u)); } catch {} }
  const mctx = document.createElement('canvas').getContext('2d');

  // ---- 版型：畫面大小與右欄位置 ----
  const portrait = fcv.width / fcv.height < 1.15;
  let iw, ih, colX, colW;
  if (portrait) {
    const sc = Math.min((PG.BOTTOM - PG.TOP) / fcv.height, 760 / fcv.width);
    iw = fcv.width * sc; ih = fcv.height * sc; colX = PG.M + iw + 50; colW = PG.W - PG.M - colX;
  } else {
    const sc = Math.min(PG.IMG_W / fcv.width, (atts.length ? 690 : PG.BOTTOM - PG.TOP) / fcv.height);
    iw = fcv.width * sc; ih = fcv.height * sc; colX = PG.COL_X; colW = PG.COL_W;
  }

  // ---- 右欄文字分頁（第 1 頁含作者／狀態，標題區較高）----
  const START0 = PG.TOP + 240, START1 = PG.TOP + 136;
  const tpages = [[]]; let ty = START0;
  const addLine = (str, font, color, h) => {
    if (ty + h > PG.BOTTOM) { tpages.push([]); ty = START1; }
    tpages[tpages.length - 1].push({ str, font, color, y: ty, h }); ty += h;
  };
  if (c.text) { mctx.font = '36px ' + PG_FONT; wrapLines(mctx, c.text, colW).forEach(l => addLine(l, '36px ' + PG_FONT, '#111', 52)); }
  else if (c.strokes.length) addLine('（僅標註畫面）', '32px ' + PG_FONT, '#8a8f98', 52);
  const reps = c.replies.filter(r => !r.deleted);
  if (reps.length) {
    ty += 14; addLine('回覆', 'bold 28px ' + PG_FONT, '#8a8f98', 42);
    for (const r of reps) { mctx.font = '30px ' + PG_FONT; wrapLines(mctx, r.author + '：' + r.text, colW).forEach(l => addLine(l, '30px ' + PG_FONT, '#444', 44)); ty += 8; }
  }

  // ---- 附件：第 k 頁可用的區域 ----
  const region = k => {
    const tb = (tpages[k] || []).reduce((m, t) => Math.max(m, t.y + t.h), k === 0 ? START0 : START1);
    const y0 = (portrait ? tb : Math.max(PG.TOP + ih, tb)) + 36;
    return { x0: portrait ? colX : PG.M, w: portrait ? colW : PG.W - PG.M * 2, y0, atop: y0 + 44, ah: PG.BOTTOM - (y0 + 44) };
  };
  const apages = [{ x0: 0, y0: 0, items: [] }];
  if (atts.length) {
    const per = portrait ? (atts.length === 1 ? 1 : 2) : (atts.length === 1 ? 1 : atts.length === 2 ? 2 : 3), gap = 24, rowGap = 16;
    const layoutRow = (imgs, R) => {
      const cellW = (R.w - gap * (per - 1)) / per;
      const capH = per === 1 ? Math.max(R.ah, 1) : Math.min(Math.max(R.ah, 1), 560);
      return imgs.map((im, k) => { const sc = Math.min(cellW / im.width, capH / im.height, 1.6); return { im, w: im.width * sc, h: im.height * sc, x: R.x0 + k * (cellW + gap) }; });
    };
    const groups = []; for (let i = 0; i < atts.length; i += per) groups.push(atts.slice(i, i + per));
    const R0 = region(0), rows0 = groups.map(g => layoutRow(g, R0));
    const hs = rows0.map(r => Math.max(...r.map(x => x.h))), tot = hs.reduce((a, b) => a + b, 0) + rowGap * (rows0.length - 1);
    Object.assign(apages[0], { x0: R0.x0, y0: R0.y0 });
    if (R0.ah >= 160 && R0.ah / tot >= 0.5) {
      // 盡量同一頁：放不下就整體縮小（最多縮到一半）
      const k = Math.min(1, R0.ah / tot); let ay = 0;
      rows0.forEach((row, ri) => { row.forEach(x => apages[0].items.push({ im: x.im, x: R0.x0 + (x.x - R0.x0) * k, w: x.w * k, h: x.h * k, y: R0.atop + ay })); ay += hs[ri] * k + rowGap; });
    } else {
      // 縮到一半仍放不下：維持原尺寸，一排一排排，放不下就接下一頁
      let R = R0, ay = 0;
      const nextPage = () => { apages.push({ x0: 0, y0: 0, items: [] }); const r = region(apages.length - 1); Object.assign(apages[apages.length - 1], { x0: r.x0, y0: r.y0 }); return r; };
      for (const imgs of groups) {
        let row = layoutRow(imgs, R);
        while (R.ah < 160 || (ay > 0 && ay + Math.max(...row.map(r => r.h)) > R.ah)) { R = nextPage(); ay = 0; row = layoutRow(imgs, R); }
        const rh = Math.max(...row.map(r => r.h));
        row.forEach(r => apages[apages.length - 1].items.push({ ...r, y: R.atop + ay }));
        ay += rh + rowGap;
      }
    }
  }

  // ---- 逐頁繪製 ----
  const N = Math.max(tpages.length, atts.length ? apages.length : 1);
  for (let k = 0; k < N; k++) {
    const cn = document.createElement('canvas'); cn.width = PG.W; cn.height = PG.H;
    const ctx = cn.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, PG.W, PG.H); ctx.textBaseline = 'top';
    ctx.font = '28px ' + PG_FONT; ctx.fillStyle = '#8a8f98'; ctx.fillText(title, PG.M, 40);
    ctx.textAlign = 'right'; ctx.fillText('評論 ' + n + ' / ' + total, PG.W - PG.M, PG.H - 56); ctx.textAlign = 'left';
    ctx.drawImage(fcv, PG.M, PG.TOP, iw, ih); ctx.strokeStyle = '#d8dbe0'; ctx.lineWidth = 2; ctx.strokeRect(PG.M, PG.TOP, iw, ih);
    let y = PG.TOP;
    ctx.fillStyle = '#111'; ctx.font = 'bold 46px ' + PG_FONT; ctx.fillText('#' + n + (k ? '（續）' : '') + '　第 ' + f + ' 幀', colX, y); y += 64;
    ctx.font = '34px ' + PG_FONT; ctx.fillStyle = '#555'; ctx.fillText(tc(f), colX, y); y += 50;
    if (k === 0) {
      ctx.font = '30px ' + PG_FONT; ctx.fillText(c.author + '　' + fmtTime(c.createdAt), colX, y); y += 46;
      ctx.fillStyle = STATUS_COLOR[c.status]; ctx.beginPath(); ctx.arc(colX + 14, y + 20, 13, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111'; ctx.font = 'bold 32px ' + PG_FONT; ctx.fillText(st.label, colX + 40, y + 2); y += 58;
    }
    ctx.strokeStyle = '#d8dbe0'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(colX, y); ctx.lineTo(colX + colW, y); ctx.stroke();
    (tpages[k] || []).forEach(t => { ctx.font = t.font; ctx.fillStyle = t.color; ctx.fillText(t.str, colX, t.y); });
    if (atts.length && apages[k] && apages[k].items.length) {
      ctx.font = 'bold 28px ' + PG_FONT; ctx.fillStyle = '#8a8f98'; ctx.fillText(k ? '附件（續）' : '附件', apages[k].x0, apages[k].y0);
      apages[k].items.forEach(r => { ctx.drawImage(r.im, r.x, r.y, r.w, r.h); ctx.strokeStyle = '#d8dbe0'; ctx.lineWidth = 2; ctx.strokeRect(r.x, r.y, r.w, r.h); });
    }
    const b = await canvasJpeg(cn); out.push({ w: PG.W, h: PG.H, data: new Uint8Array(await b.arrayBuffer()) });
  }
  return out;
}

async function exportPdf() {
  const list = sortedLive();
  if (!video.duration) { toast('請先選擇影片'); return; }
  if (!list.length) { toast('目前沒有評論可匯出'); return; }
  if (state.busy) return;
  state.busy = true; setDrawing(false);
  const saveT = video.currentTime, pages = [], title = state.videoMeta.name;
  try {
    for (let i = 0; i < list.length; i++) {
      modal('<div>正在匯出 PDF：第 ' + (i + 1) + ' / ' + list.length + ' 則…<br>請稍候，不要關閉視窗</div>');
      const c = list[i]; video.pause();
      await seekTime((cFrame(c) + 0.5) / state.fps); await wait(220);
      pages.push(...await renderCommentPages(c, i + 1, list.length, frameCanvas(c), title));
    }
    download(makePdf(pages), baseName(title) + '_審核報告.pdf');
    toast('已匯出 PDF，共 ' + pages.length + ' 頁');
  } catch (err) { console.error(err); toast('匯出失敗，請再試一次', 4000); }
  video.currentTime = saveT; state.busy = false; closeModal();
}

/* ---------- 播放控制 ---------- */
function togglePlay() {
  if (!video.duration) return;
  if (video.paused) { if (state.drawing) setDrawing(false); if (video.ended) video.currentTime = 0; video.play().catch(() => {}); }
  else video.pause();

function bindRepeat(id, fn) {
  const b = $(id); let t1, t2;
  const stop = () => { clearTimeout(t1); clearInterval(t2); };
  b.addEventListener('pointerdown', e => { e.preventDefault(); fn(); stop(); t1 = setTimeout(() => { t2 = setInterval(fn, 70); }, 400); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
}
bindRepeat('#bM10', () => stepFrames(-10)); bindRepeat('#bM1', () => stepFrames(-1));
bindRepeat('#bP1', () => stepFrames(1));    bindRepeat('#bP10', () => stepFrames(10));
$('#bPlay').onclick = togglePlay;
$('#rateSel').onchange = e => { video.playbackRate = +e.target.value; };
$('#fpsSel').innerHTML = FPS_OPTIONS.map(f => '<option value="' + f + '">' + f + ' fps</option>').join('');
$('#fpsSel').onchange = e => { state.fps = +e.target.value; renderList(); renderMarks(); updateComposer(); lastFrame = -1; needRender = true; };
const startDrawing = () => {
  if (!video.duration) { toast('請先選擇影片'); return; }
  if (!state.draft.editingId && commentAt(curFrame())) { toast('此幀已有評論，一幀只能有一則：請按「編輯」或回覆'); return; }
  setDrawing(true);
};
$('#bDraw').onclick = () => (state.drawing ? setDrawing(false) : startDrawing());
$('#bDraw2').onclick = startDrawing;

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#modal').hidden && !state.busy) closeModal(); else if (state.drawing) setDrawing(false); return; }
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); stepFrames(e.shiftKey ? -10 : -1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); stepFrames(e.shiftKey ? 10 : 1); }
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && state.drawing) { e.preventDefault(); $('#bUndo').click(); }
});

/* 畫圖工具列 */
$('#swatches').innerHTML = SWATCHES.map(c => '<button class="sw' + (c === state.color ? ' on' : '') + '" data-c="' + c + '" style="background:' + c + '" title="' + c + '"></button>').join('');
function setColor(c) {
  state.color = c; $('#colorIn').value = c;
  $('#swatches').querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.c === c));
}
$('#swatches').addEventListener('click', e => { const b = e.target.closest('.sw'); if (b) setColor(b.dataset.c); });
$('#colorIn').oninput = e => { state.color = e.target.value; $('#swatches').querySelectorAll('.sw').forEach(b => b.classList.remove('on')); };
$('#drawbar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tool) { state.tool = b.dataset.tool; $('#drawbar').querySelectorAll('[data-tool]').forEach(x => x.classList.toggle('on', x === b)); }
  if (b.dataset.w) { state.width = +b.dataset.w; $('#drawbar').querySelectorAll('[data-w]').forEach(x => x.classList.toggle('on', x === b)); }
});
$('#bUndo').onclick = () => {
  const d = state.draft; d.strokes.pop();
  if (!d.strokes.length && !d.editingId) d.time = null;
  needRender = true; updateComposer();
};
$('#bClear').onclick = () => {
  const d = state.draft; if (!d.strokes.length) return;
  d.strokes = []; if (!d.editingId) d.time = null; needRender = true; updateComposer();
};

/* 評論欄寬度拖曳 */
(() => {
  const sp = $('#split'); let drag = false;
  const saved = parseInt(lsGet('vr_panelw') || '', 10); if (saved >= 240) document.documentElement.style.setProperty('--panel-w', saved + 'px');
  sp.addEventListener('pointerdown', e => { drag = true; sp.setPointerCapture(e.pointerId); });
  sp.addEventListener('pointermove', e => {
    if (!drag) return;
    const w = Math.min(window.innerWidth * 0.7, Math.max(240, window.innerWidth - e.clientX));
    document.documentElement.style.setProperty('--panel-w', w + 'px');
  });
  sp.addEventListener('pointerup', () => { drag = false; lsSet('vr_panelw', String(Math.round($('#panel').getBoundingClientRect().width))); });
})();

/* ---------- 主迴圈 ---------- */
let lastFrame = -1, lastPaused = null, lastCT = -1;
function loop() {
  if (video.duration) {
    const f = curFrame();
    if (f !== lastFrame || video.paused !== lastPaused) {
      lastFrame = f; lastPaused = video.paused;
      $('#frText').textContent = '第 ' + f + ' / ' + totalFrames() + ' 幀';
      $('#tcText').textContent = tc(f);
      $('#bPlay').textContent = video.paused ? '▶' : '⏸';
      const d = state.draft;
      if (!state.busy && !d.editingId && d.strokes.length && frameOf(d.time) !== f) {
        toast('已放棄第 ' + frameOf(d.time) + ' 幀未送出的畫圖');
        d.strokes = []; d.time = null; curStroke = null; updateComposer();
      } else if (!d.strokes.length && !d.editingId) updateComposer();
      markCards(true); needRender = true;
    }
    if (video.currentTime !== lastCT) {
      lastCT = video.currentTime;
      const r = Math.min(1, lastCT / video.duration) * 100;
      $('#tlfill').style.width = r + '%'; $('#tlhead').style.left = r + '%';
    }
  }
  if (needRender) { needRender = false; render(); }
  requestAnimationFrame(loop);
}

/* ---------- 啟動 ---------- */
$('#ver').textContent = 'v' + VERSION;
state.author = lsGet('vr_name') || '';
updateNameBtn(); renderList(); updateComposer();
if (!state.author) askName();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
